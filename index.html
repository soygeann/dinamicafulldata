<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fulldata - Carga de Red</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #050811; color: #00e5ff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; text-align: center; overflow: hidden; }
    .card { background: rgba(255, 255, 255, 0.05); border: 2px solid #00e5ff; border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 380px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.2); backdrop-filter: blur(10px); }
    h1 { font-size: 20px; margin-bottom: 10px; text-transform: uppercase; }
    p { color: #a0aec0; font-size: 14px; margin-bottom: 25px; line-height: 1.4; }
    .progress-container { width: 100%; background: #1a202c; border-radius: 10px; height: 35px; border: 1px solid #00e5ff; overflow: hidden; margin-bottom: 15px; }
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00e5ff, #0077ff); transition: width 0.08s ease-out; }
    .shake-icon { font-size: 50px; margin-bottom: 15px; animation: shake 0.6s infinite alternate; }
    @keyframes shake { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }

    /* Botón de Inicio y Permisos */
    .btn-start { width: 100%; padding: 16px; background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; font-weight: 900; border: none; border-radius: 12px; font-size: 16px; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 15px rgba(0,229,255,0.4); }

    /* Botón de Respaldo por Taps */
    .btn-tap-fallback { width: 100%; padding: 12px; background: transparent; border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff; font-weight: bold; border-radius: 8px; margin-top: 15px; font-size: 12px; text-transform: uppercase; cursor: pointer; }

    /* Estilo Ganador */
    body.winner { background-color: #00e5ff !important; color: #000 !important; }
    body.winner .card { background: #fff; border: 4px solid #000; }
    body.winner h1 { font-size: 26px; color: #000; }

    /* Estilo Agotado */
    body.loser { background-color: #1a0007 !important; color: #ff0055 !important; }
    body.loser .card { border-color: #ff0055; }
  </style>
</head>
<body>

<div class="card" id="app">
  <div class="shake-icon">📱💥</div>
  <h1 id="mainTitle">ACTIVACIÓN DE RED</h1>
  <p id="mainDesc">Presiona el botón para sincronizar tus sensores e iniciar la carga cinemática.</p>
  
  <button class="btn-start" id="startBtn" onclick="initSensors()">⚡ INICIAR Y PERMITIR SENSORES</button>

  <div id="gameUI" style="display: none;">
    <div class="progress-container">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div id="percentText" style="font-weight: bold; font-size: 22px; margin-bottom: 10px;">0%</div>
    <p style="font-size: 12px; color: #00e5ff;">¡AGITA FUERTE TU TELÉFONO EN EL AIRE!</p>

    <!-- Botón de respaldo si el acelerómetro no responde en ese equipo -->
    <button class="btn-tap-fallback" onclick="manualIncrement()">¿No carga? Toca aquí repetidamente</button>
  </div>
</div>

<script>
  // Firebase Config (Sustituye con tus credenciales reales)
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "tu-proyecto.firebaseapp.com",
    databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
    projectId: "tu-proyecto",
    storageBucket: "tu-proyecto.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };
  
  if (firebaseConfig.apiKey !== "TU_API_KEY") {
    firebase.initializeApp(firebaseConfig);
  }

  let energy = 0;
  let isFinished = false;
  let lastX = null, lastY = null, lastZ = null;

  function initSensors() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('mainTitle').innerText = '¡AGITA TU TELÉFONO!';
    document.getElementById('mainDesc').innerText = 'Genera energía cinemática para reactivar el nodo de Fulldata.';
    document.getElementById('gameUI').style.display = 'block';

    // Solicitud explícita de permisos para iOS 13+
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(response => {
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
          } else {
            alert('Permiso denegado. Puedes usar el botón de toque manual.');
          }
        })
        .catch(console.error);
    } else if (window.DeviceMotionEvent) {
      // Android / iOS antiguo
      window.addEventListener('devicemotion', handleMotion);
    }
  }

  function handleMotion(event) {
    if (isFinished) return;

    let acc = event.acceleration || event.accelerationIncludingGravity;
    if (!acc) return;

    let x = acc.x || 0;
    let y = acc.y || 0;
    let z = acc.z || 0;

    if (lastX !== null) {
      let deltaX = Math.abs(x - lastX);
      let deltaY = Math.abs(y - lastY);
      let deltaZ = Math.abs(z - lastZ);
      
      let speed = deltaX + deltaY + deltaZ;

      // Umbral adaptativo de agitación
      if (speed > 12) { 
        addEnergy(2.5);
      }
    }

    lastX = x;
    lastY = y;
    lastZ = z;
  }

  function manualIncrement() {
    if (!isFinished) addEnergy(4);
  }

  function addEnergy(amount) {
    energy += amount;
    if (energy > 100) energy = 100;

    document.getElementById('bar').style.width = energy + '%';
    document.getElementById('percentText').innerText = Math.round(energy) + '%';

    if (energy >= 100 && !isFinished) {
      isFinished = true;
      claimWinner();
    }
  }

  function claimWinner() {
    if (typeof firebase === 'undefined' || firebaseConfig.apiKey === "TU_API_KEY") {
      // Si Firebase aún no está configurado, muestra victoria local para pruebas
      showWinner(1);
      return;
    }

    const db = firebase.database();
    const winnersRef = db.ref('winners_motion');

    winnersRef.transaction((current) => {
      if (current === null) return [{ time: Date.now() }];
      if (current.length < 2) {
        current.push({ time: Date.now() });
        return current;
      }
      return;
    }, (err, committed, snapshot) => {
      if (committed) {
        const list = snapshot.val();
        if (list && list.length <= 2) {
          showWinner(list.length);
        } else {
          showLoser();
        }
      } else {
        showLoser();
      }
    });
  }

  function showWinner(pos) {
    document.body.className = "winner";
    document.getElementById('app').innerHTML = `
      <h1>⚡ ¡SISTEMA RESTAURADO! ⚡</h1>
      <p style="font-size: 20px; font-weight: bold; color:#000; margin-bottom:15px;">¡ERES EL GANADOR #${pos}!</p>
      <p style="color:#000; font-weight: 600;">Levanta tu teléfono en el aire con esta pantalla verde encendida para que te vean desde el escenario.</p>
    `;
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
  }

  function showLoser() {
    document.body.className = "loser";
    document.getElementById('app').innerHTML = `
      <h2>⚠ NODOS OCUPADOS</h2>
      <p>Los 2 primeros usuarios en agitar su teléfono restablecieron la red antes.</p>
      <br>
      <p style="color:#a0aec0; font-size:12px;">En un mundo con lag, solo la velocidad real de Fulldata te salva.</p>
    `;
  }
</script>
</body>
</html>
