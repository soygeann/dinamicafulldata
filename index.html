<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fulldata - Caza el Nodo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    
    /* Colores Fulldata */
    body { background-color: #09003f; color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; text-align: center; overflow: hidden; }
    
    .card { background: rgba(255, 255, 255, 0.05); border: 2px solid #0092ff; border-radius: 20px; padding: 25px 20px; width: 100%; max-width: 380px; box-shadow: 0 0 35px rgba(0, 146, 255, 0.25); backdrop-filter: blur(12px); }
    
    h1 { font-size: 22px; margin-bottom: 6px; text-transform: uppercase; color: #ffffff; letter-spacing: 0.5px; }
    p { color: #d0d7de; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
    
    /* Formulario */
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #0092ff; text-transform: uppercase; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(0, 146, 255, 0.4); border-radius: 10px; color: #fff; font-size: 15px; outline: none; user-select: text; }
    .form-control:focus { border-color: #0092ff; box-shadow: 0 0 10px rgba(0, 146, 255, 0.5); }
    
    .hud { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-bottom: 15px; background: rgba(0, 146, 255, 0.15); padding: 12px 18px; border-radius: 12px; border: 1px solid #0092ff; }
    .hud span { color: #0092ff; }

    /* Cuadrícula de Nodos (3x3) */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; aspect-ratio: 1; margin-bottom: 15px; touch-action: manipulation; }
    .node { background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(0, 146, 255, 0.2); border-radius: 14px; transition: background-color 0.05s ease; -webkit-tap-highlight-color: transparent; }
    .node.active { background: #0092ff !important; border-color: #ffffff !important; box-shadow: 0 0 30px #0092ff; }

    .btn-action { width: 100%; padding: 16px; background: #0092ff; color: #ffffff; font-weight: 900; border: none; border-radius: 12px; font-size: 16px; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 20px rgba(0, 146, 255, 0.5); transition: transform 0.1s; }
    .btn-action:active { transform: scale(0.98); }

    .btn-download { width: 100%; padding: 10px; background: transparent; border: 1px dashed rgba(255,255,255,0.3); color: #8a99ad; border-radius: 8px; font-size: 11px; margin-top: 15px; cursor: pointer; }

    /* Estilo Ganador (Pantalla Verde Neón) */
    body.winner { background-color: #00ff66 !important; color: #000000 !important; }
    body.winner .card { background: #ffffff; border: 4px solid #000000; box-shadow: 0 0 40px rgba(0, 0, 0, 0.4); }
    body.winner h1 { color: #000000; }
    body.winner p { color: #000000; }

    /* Estilo Finalizado */
    body.finished { background-color: #050026 !important; }
  </style>
</head>
<body>

<div class="card" id="app">
  
  <!-- FASE 1: REGISTRO DE PARTICIPANTE -->
  <div id="registerScreen">
    <h1>Sincronización de Red</h1>
    <p>Ingresa tus datos para participar y registrar tu velocidad.</p>
    
    <div class="form-group">
      <label for="userName">Nombre y Apellido</label>
      <input type="text" id="userName" class="form-control" placeholder="Ej. Carlos Pérez" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="userPhone">Teléfono de Contacto</label>
      <input type="tel" id="userPhone" class="form-control" placeholder="Ej. 04141234567" autocomplete="off">
    </div>

    <button class="btn-action" style="margin-top: 10px;" onclick="validateAndStart()">⚡ INICIAR PRUEBA</button>
  </div>

  <!-- FASE 2: PANTALLA DE JUEGO -->
  <div id="gameScreen" style="display: none;">
    <h1>¡CAZA LOS NODOS!</h1>
    <p style="margin-bottom: 10px;">Toca las casillas encendidas lo más rápido posible.</p>

    <div class="hud">
      <div>Puntos: <span id="scoreText">0</span></div>
      <div>Tiempo: <span id="timeText">15</span>s</div>
    </div>

    <div class="grid" id="grid">
      <div class="node" id="node-0"></div>
      <div class="node" id="node-1"></div>
      <div class="node" id="node-2"></div>
      <div class="node" id="node-3"></div>
      <div class="node" id="node-4"></div>
      <div class="node" id="node-5"></div>
      <div class="node" id="node-6"></div>
      <div class="node" id="node-7"></div>
      <div class="node" id="node-8"></div>
    </div>
  </div>

  <!-- FASE 3: RESULTADO FINAL -->
  <div id="resultScreen" style="display: none;"></div>

</div>

<script>
  let playerData = { name: '', phone: '' };
  let score = 0;
  let timeLeft = 15;
  let activeIndex = -1;
  let gameTimeout = null;
  let timerInterval = null;
  let isPlaying = false;
  const nodes = [];

  window.onload = () => {
    for (let i = 0; i < 9; i++) {
      const el = document.getElementById(`node-${i}`);
      nodes.push(el);
      
      const handleTap = (e) => {
        e.preventDefault();
        tapNode(i);
      };

      el.addEventListener('pointerdown', handleTap);
    }
  };

  function validateAndStart() {
    const nameInput = document.getElementById('userName').value.trim();
    const phoneInput = document.getElementById('userPhone').value.trim();

    if (!nameInput || !phoneInput) {
      alert("Por favor ingresa tu nombre y teléfono para continuar.");
      return;
    }

    playerData.name = nameInput;
    playerData.phone = phoneInput;

    document.getElementById('registerScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';

    startGame();
  }

  function startGame() {
    score = 0;
    timeLeft = 15;
    isPlaying = true;
    document.getElementById('scoreText').innerText = score;
    document.getElementById('timeText').innerText = timeLeft;

    spawnNewNode();
    
    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timeText').innerText = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function spawnNewNode() {
    if (!isPlaying) return;

    if (gameTimeout) clearTimeout(gameTimeout);

    if (activeIndex !== -1 && nodes[activeIndex]) {
      nodes[activeIndex].classList.remove('active');
    }

    let newIndex;
    do {
      newIndex = Math.floor(Math.random() * 9);
    } while (newIndex === activeIndex);

    activeIndex = newIndex;
    nodes[activeIndex].classList.add('active');

    gameTimeout = setTimeout(() => {
      if (isPlaying) spawnNewNode();
    }, 600);
  }

  function tapNode(index) {
    if (!isPlaying) return;

    if (index === activeIndex) {
      score++;
      document.getElementById('scoreText').innerText = score;
      if (navigator.vibrate) navigator.vibrate(30);
      spawnNewNode();
    }
  }

  function endGame() {
    isPlaying = false;
    clearInterval(timerInterval);
    if (gameTimeout) clearTimeout(gameTimeout);

    if (activeIndex !== -1 && nodes[activeIndex]) {
      nodes[activeIndex].classList.remove('active');
    }

    document.getElementById('gameScreen').style.display = 'none';
    processAndSaveResult(score);
  }

  // ALMACENAMIENTO LOCAL Y GENERACIÓN DE TXT
  function processAndSaveResult(finalScore) {
    const resultScreen = document.getElementById('resultScreen');
    resultScreen.style.display = 'block';

    // 1. Cargar historial local
    let history = JSON.parse(localStorage.getItem('fulldata_leaderboard') || "[]");

    // 2. Crear nuevo registro
    const newRecord = {
      id: Date.now(),
      name: playerData.name,
      phone: playerData.phone,
      score: finalScore,
      timestamp: new Date().toLocaleTimeString()
    };

    history.push(newRecord);

    // 3. Ordenar de mayor a menor puntaje
    history.sort((a, b) => b.score - a.score);

    // 4. Guardar en localStorage
    localStorage.setItem('fulldata_leaderboard', JSON.stringify(history));

    // 5. Verificar si este participante quedó en el TOP 2
    const topTwo = history.slice(0, 2);
    const isWinner = topTwo.some(item => item.id === newRecord.id);

    if (isWinner) {
      const position = topTwo.findIndex(item => item.id === newRecord.id) + 1;
      showWinnerScreen(position, playerData.name, finalScore);
    } else {
      showStandardScreen(playerData.name, finalScore);
    }
  }

  function showWinnerScreen(pos, name, score) {
    document.body.className = "winner";
    const resultScreen = document.getElementById('resultScreen');
    
    resultScreen.innerHTML = `
      <h1 style="font-size: 26px;">⚡ ¡GANADOR TOP #${pos}! ⚡</h1>
      <div style="background: #000; color: #00ff66; padding: 15px; border-radius: 12px; margin: 15px 0;">
        <p style="font-size: 20px; font-weight: bold; color: #fff;">${name.toUpperCase()}</p>
        <p style="font-size: 36px; font-weight: 900; color: #00ff66;">${score} PUNTOS</p>
      </div>
      <p style="font-weight: 700; font-size: 14px;">Muestra esta pantalla al moderador en la tarima para validar tu premio.</p>
      <button class="btn-download" onclick="exportToTXT()">📄 Descargar Registro TXT</button>
    `;
    if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
  }

  function showStandardScreen(name, score) {
    document.body.className = "finished";
    const resultScreen = document.getElementById('resultScreen');
    
    resultScreen.innerHTML = `
      <h2 style="color:#0092ff;">PRUEBA COMPLETADA</h2>
      <p style="font-size: 15px; margin: 10px 0;">Participante: <b>${name}</b></p>
      <p style="font-size: 32px; font-weight: 900; color: #ffffff; margin-bottom: 10px;">${score} NODOS</p>
      <p style="color:#a0aec0; font-size: 12px;">Tu puntaje ha sido guardado exitosamente.</p>
      <br>
      <p style="color:#0092ff; font-size:12px; font-weight: bold;">En un mundo con lag, solo la ultra-velocidad de Fulldata te salva.</p>
      <button class="btn-download" onclick="exportToTXT()">📄 Descargar Registro TXT</button>
    `;
  }

  // Función para descargar el archivo .txt con la estructura exacta
  function exportToTXT() {
    let history = JSON.parse(localStorage.getItem('fulldata_leaderboard') || "[]");
    
    if (history.length === 0) {
      alert("No hay registros almacenados.");
      return;
    }

    let txtContent = "===========================================\n";
    txtContent += "    FULLDATA - REGISTRO DE PARTICIPANTES   \n";
    txtContent += "===========================================\n\n";

    txtContent += "--- TOP 2 GANADORES ---\n";
    history.slice(0, 2).forEach((item, index) => {
      txtContent += `[LUGAR #${index + 1}] ${item.name} | Tel: ${item.phone} | Puntaje: ${item.score} pts | Hora: ${item.timestamp}\n`;
    });

    txtContent += "\n--- HISTORIAL COMPLETO DE PARTICIPANTES ---\n";
    history.forEach((item, index) => {
      txtContent += `#${index + 1} | Nombre: ${item.name} | Tel: ${item.phone} | Puntaje: ${item.score} | Hora: ${item.timestamp}\n`;
    });

    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `resultados_fulldata_${new Date().toISOString().slice(0,10)}.txt`;
    link.click();
  }
</script>
</body>
</html>
